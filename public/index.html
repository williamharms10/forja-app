<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14161A" />
    <title>FORJA — Treino, Dieta e Água</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FORJA" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      :root {
        --bg: #14161A;
        --surface: #1D2026;
        --surface-2: #262A31;
        --border: #33383F;
        --text: #F2F1EC;
        --text-muted: #9A9EA6;
        --text-faint: #5C616A;
        --accent-energy: #C8FF4D;
        --accent-water: #4FA8FF;
        --accent-food: #FF7A52;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); height: 100%; }
      body { font-family: var(--font-body); color: var(--text); }
      #root { min-height: 100dvh; }
      input, select {
        font-family: var(--font-body);
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
        width: 100%;
      }
      input:focus, select:focus { border-color: var(--accent-energy); }
      ::placeholder { color: var(--text-faint); }
      button { font-family: var(--font-body); cursor: pointer; }
      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 16px; padding: 16px; margin-bottom: 14px;
      }
      .btn-primary {
        background: var(--accent-energy); color: #14161A; border: none;
        border-radius: 10px; padding: 10px 0; font-weight: 800; font-size: 13px; width: 100%;
      }
      .btn-secondary {
        background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 13px;
      }
      .icon-btn {
        width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--surface-2); color: var(--text); display: flex; align-items: center;
        justify-content: center;
      }
      .bar-track { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 99px; transition: width .35s ease; }
      .suggest-box {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
        overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.35); max-height: 220px; overflow-y: auto;
      }
      .suggest-item {
        display: flex; justify-content: space-between; align-items: center; width: 100%;
        background: none; border: none; padding: 9px 12px; cursor: pointer; text-align: left;
        border-bottom: 1px solid var(--border); font-family: var(--font-body); color: var(--text);
      }
      .tabbar-btn {
        flex: 1; background: none; border: none; padding: 12px 4px 14px; display: flex;
        flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--text-faint);
      }
      .tabbar-btn.active { color: var(--text); }
      .scrollarea::-webkit-scrollbar { width: 6px; }
      .scrollarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Firebase SDK (compat, sem precisar de build/bundler) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>

    <script src="/firebase-config.js"></script>
    <script src="/data.js"></script>
    <script src="/icons.js"></script>
    <script src="/storage.js"></script>
    <script src="/login.js"></script>
    <script src="/voice.js"></script>
    <script src="/app.js"></script>
    <script src="/app-events.js"></script>
  </body>
</html>
